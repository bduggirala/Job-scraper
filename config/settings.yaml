# ---------------------------------------------------------------------------
# Company ATS Scraper configuration
#
# This pipeline is INDEPENDENT of the JobSpy pipeline. Nothing here is shared
# with, merged into, or deduplicated against JobSpy output.
# ---------------------------------------------------------------------------

# Path to the input workbook. Relative paths resolve against the project root.
input_excel: config/companies.xlsx
input_sheet: null          # null = first sheet

# Column names expected in the workbook.
columns:
  company: Company
  ats_url: ATS URL
  live_jobs_url: Live Jobs Page (if ATS URL unavailable)

# --- Date filtering --------------------------------------------------------
hours_old: 168

# --- Location filtering ----------------------------------------------------
locations:
  - Dallas
  - Irving
  - Plano
  - Richardson
  - Frisco
  - Addison
  - Coppell
  - Farmers Branch
  - Westlake
  - Fort Worth
  - DFW
  - Dallas-Fort Worth
  - Grapevine
  - Las Colinas

include_remote: true

# A DFW city token only counts if the location string does not also name a
# different U.S. state (protects against "Westlake Village, CA",
# "Richardson, UT", etc.).
enforce_texas_for_city_match: true

# --- Target roles ----------------------------------------------------------
# Titles are split on separators (, - | / etc.) and each segment is tested.
# A job matches if ANY segment matches a target pattern and that same segment
# does not match an exclude pattern.
#
# '\bdata\b' is deliberately broad - any title naming "data" as its own word
# (Data Analyst, Data Platform Engineer, Business Data Analyst, ...), while
# still not matching inside "database" (no word boundary between "data" and
# "base"). The technology-specific patterns catch roles that don't literally
# say "data" (Snowflake/Databricks/ETL/Analytics Engineer).
target_role_patterns:
  - '\bdata\b'
  - '\bsnowflake\s+(engineer|developer)'
  - '\bdatabricks\s+(engineer|developer)'
  - '\betl\s+(developer|engineer)'
  - '\banalytics\s+engineer'

# Segments matching these are rejected even if a target pattern also matched.
# lead/manager/principal exclude senior/people-management titles - the
# request was individual-contributor "data" roles, not their managers.
# data center/data entry are the two false-positive categories '\bdata\b'
# pulls in that aren't data engineering at all - confirmed live: 8 of 33
# matches in one run were "Data Center" facilities/infrastructure roles
# (HVAC Technician, Sr Structural Engineer, Sales Executive - all "Data
# Centers" as a facility, not the discipline) plus one clerical "Data Entry"
# posting.
exclude_role_patterns:
  - '\bdata\s+scientist'
  - '\bdata\s+science\b'
  - '\bmachine\s+learning\s+engineer'
  - '\bml\s+engineer'
  - '\b(intern|internship|co-?op)\b'
  - '\bdata\s*center'
  - '\bdata\s+entry\b'

  # Non-engineering "data" roles. '\banalyst\b' is written as its own word so
  # it rejects "Data Analyst" / "Sr. Analyst, Data Analysis" while leaving
  # "Data Analytics Engineer" and "Analytics Engineer" alone - those are
  # target roles, and "analytics" is a different word from "analyst".
  # Confirmed against a live Capital One run: of 35 titles matching '\bdata\b',
  # all but one were analyst/scientist/manager roles rather than engineering.
  - '\banalyst\b'
  - '\banalysis\b'
  - '\bbusiness\s+intelligence\b'
  - '\bdata\s+steward'
  - '\bdata\s+governance\b'
  - '\bdata\s+architect\b'
  # Non-engineering roles that merely sit near data, seen in the same run:
  # "Data Annotator", "Principal Associate, Accounting - CPC Card Data Team",
  # "Sr Associate, Product Management - Finance Data". None risk a real
  # engineering title.
  - '\bannotator\b'
  - '\baccounting\b'
  - '\bproduct\s+management\b'

  # Management, by shape rather than by seniority word. The previous
  # '\b(lead|manager|principal)\b' also rejected "Lead Data Engineer" and
  # "Principal Data Engineer", which are individual-contributor titles at most
  # employers and among the most relevant senior postings there are.
  - '\b(manager|director|head\s+of|vice\s+president|vp)\b'
  - '\bmanaging\s+consultant\b'

# --- Playwright fallback ---------------------------------------------------
playwright:
  enabled: true
  headless: true
  timeout_ms: 30000
  # Pagination / "Load More" click limit per company. The loop already stops
  # early once a site runs out of pages (no control found, no scroll
  # growth), so this mainly bounds genuinely large employers rather than
  # adding overhead to the common 1-2-page case. Raised from 5 after fixing
  # _paginate_and_extract to accumulate across pages instead of keeping only
  # the last one - confirmed Goldman Sachs 20->120 and IBM 30->162 jobs at 5.
  max_pages: 10
  wait_after_load_ms: 2500  # settle time for client-side rendering

  # The browser needs a DIFFERENT User-Agent than requests.user_agent below.
  # A bare "Mozilla/5.0" defeats AWS WAF on iCIMS hosts, but Cloudflare
  # rejects it outright in a real browser context (a genuine Chrome never
  # sends a UA that short), which silently costs every Cloudflare-protected
  # careers site - confirmed against jobs.centene.com, which serves a
  # challenge page with the bare UA and the real page with this one.
  user_agent: >-
    Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
    (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36

  # Careers landing pages often bury the real job list several links deep
  # ("Career Areas" -> "Jobs" -> "Search Jobs"). Traversal is best-first by
  # link score and bounded three ways so one sprawling site cannot consume
  # the 240s per-company limit: max_hops caps depth, max_hop_visits caps
  # total pages rendered, hop_budget_seconds caps wall-clock.
  max_hops: 5
  max_hop_visits: 12
  hop_budget_seconds: 100
  # A landing page often shows 1-3 "featured" roles. Returning those as if
  # they were the job list hides thousands of real openings, so traversal
  # only stops early on a page that looks like a genuine list; anything
  # smaller is remembered as a fallback while the search continues.
  hop_good_enough_rows: 10
  # Try the page's own search box at each level, not only at the end. Many
  # job lists render only after a keyword is submitted.
  search_at_each_hop: true

  # Navigation failures are usually transient (Chromium's DNS resolver
  # buckling under concurrent browser instances, or a site resetting a
  # repeat fingerprint) rather than a genuinely dead site. Retries use a
  # fresh context with a rotated user-agent/viewport.
  nav_retries: 3
  nav_retry_backoff_ms: 2000

  # Patch the JS fingerprints headless Chromium leaks (navigator.webdriver,
  # missing plugins, WebGL vendor). Required to get past Cloudflare-style
  # challenges on some career sites.
  stealth: true

  # Triggered only when the first page load finds zero job rows. Types one
  # search term into a detected keyword input, submits, and re-extracts -
  # while also watching network traffic for a real ATS endpoint the static
  # HTML resolver couldn't see (many custom career pages only call their ATS
  # once you interact with them).
  #
  # "Data" rather than "Data Engineer": for these companies the site's own
  # search is the only source of jobs we ever see - target_role_patterns can
  # only filter what actually got fetched, so a narrower search term here
  # would silently drop titles like "Data Analyst" or "Analytics Engineer"
  # before the role filter ever runs.
  search_fallback:
    enabled: true
    max_wait_ms: 6000

    # On a search-driven site the site's own search is the only view of its
    # jobs we ever get, so one term is a coverage ceiling, not a filter: a role
    # whose title contains no "data" - Snowflake Engineer, Databricks Engineer,
    # ETL Developer, Analytics Engineer - is simply invisible to a "Data"
    # query, and those are all on the target list.
    #
    # Broad terms first: results merge and de-duplicate across queries, and
    # each row records which query found it (`source_query`). Searching stays
    # broad on purpose - target_role_patterns does the narrowing afterwards,
    # and can only ever filter what was actually fetched.
    search_terms:
      - "Data"
      - "Engineer"
      - "Analytics"
      - "ETL"

    # Bound per company: each query costs a submit plus max_wait_ms.
    max_queries: 4

    # Retained so an older config keeps working; search_terms wins when set.
    search_term: "Data"

# --- HTTP behaviour --------------------------------------------------------
requests:
  timeout_seconds: 30
  retries: 3
  backoff_factor: 2
  # A full Chrome/122 UA string trips AWS WAF Bot Control's captcha
  # challenge on several iCIMS tenants (confirmed directly against
  # events-statefarm.icims.com, careers-realpagepms.icims.com,
  # fmglobal.icims.com: full UA -> HTTP 405 + captcha, bare UA -> HTTP 200,
  # reproduced 6/6). A generic UA doesn't match the bot signatures WAF
  # blocklists.
  user_agent: "Mozilla/5.0"

  # Legacy page-count guard, still used by collectors not yet converted to
  # CollectionResult (iCIMS, SuccessFactors, Avature, Taleo, Paylocity).
  max_pages_per_company: 25

  # Job-count ceiling for converted collectors. Expressed in JOBS, not pages,
  # because a shared *page* budget means a different job ceiling per provider:
  # 25 pages was 250 jobs on Phenom (10/page) and 5,000 on Oracle (200/page).
  # That mismatch silently truncated 23 companies - measured against a real
  # run, eleven Workday tenants returned exactly 500 (20 x 25) and seven
  # Phenom tenants exactly 250 (10 x 25).
  #
  # Tripping this ceiling is not an error, but it does mark the scrape
  # incomplete, which suppresses removal sync for that company and lists it in
  # the run summary. Raise it if the summary keeps reporting a real shortfall.
  max_jobs_per_company: 10000

  # Politeness ceiling per hostname, shared across all HTTP workers. Raising
  # max_jobs_per_company multiplied what one company can request (a large
  # Workday tenant went from 25 requests to as many as 500), and ten workers
  # scraping different companies on the same vendor host are ten concurrent
  # callers of that host. Keyed on host, so a slow vendor never throttles
  # unrelated companies. Set to 0 to disable.
  per_host_rate_per_second: 3.0

# --- Concurrency -----------------------------------------------------------
concurrency:
  http_workers: 10
  # Measured, not guessed: raising this to 5 dropped a full run from 137/171
  # to 105/171, with 51 companies failing on net::ERR_INTERNET_DISCONNECTED -
  # five concurrent Chromium instances saturate this machine's network. Three
  # is the tested ceiling here.
  playwright_workers: 3

  # Hard wall-clock budget per phase. Playwright can block inside its own
  # event loop with no timeout of its own (a page whose overlay intercepts
  # every click will spin in an actionability retry loop forever), which
  # would otherwise stall the entire run. Anything unfinished when the
  # budget expires is recorded as a Timeout failure and the run continues.
  # Per-company limits, measured from when a company actually starts (not
  # when it was queued). This is the bound that matters: without it, one
  # wedged page costs the entire phase budget.
  # Raised from 300s alongside the jobs-based pagination ceiling and per-host
  # pacing. A 10,000-job Workday tenant is 500 sequential requests; at 3 req/s
  # plus latency that is ~320s, which would have been recorded as a Timeout
  # failure under the old limit - losing the company entirely, which is worse
  # than the truncation the higher ceiling was meant to fix.
  api_company_timeout_seconds: 900      # 15 min
  # Multi-layer traversal can render up to max_hop_visits pages before it
  # concludes, and nav retries stack on top. At 240s companies that finish
  # comfortably in isolation (7-Eleven, Omnicell) were being cut off
  # mid-traversal and recorded as Timeout failures. At 360s, Slalom's
  # traversal found its 21 jobs (logged) in 27s but the browser context
  # teardown under full 3-worker concurrency wasn't observed finishing until
  # ~5.5 minutes in, so the already-successful result was still discarded as
  # a Timeout - isolated re-runs of Slalom alone complete in under 30s.
  browser_company_timeout_seconds: 480  # 8 min

  # Phase-wide backstops.
  api_phase_timeout_seconds: 1800      # 30 min
  browser_phase_timeout_seconds: 2400  # 40 min

# --- Storage / output ------------------------------------------------------
database_path: data/jobs.db

output:
  directory: output
  csv: company_jobs.csv
  json: company_jobs.json
  xlsx: company_jobs.xlsx          # emailed as the attachment
  failures: scraper_failures.csv
  raw_csv: company_jobs_raw.csv    # only written with --save-raw

# --- Notifications ---------------------------------------------------------
# A digest of new and changed matching jobs, with the spreadsheet attached.
#
# Sent only on a FULL run, only when there is something new, and only when
# every company completed - a truncated run has not seen the pages it missed,
# so its "new" set is not a real answer. Each job is announced once per kind
# (new / changed), tracked in the `notifications` table.
#
# CREDENTIALS ARE READ FROM THE ENVIRONMENT ONLY. This file is in git; an SMTP
# password must never be able to land in it. Set before running:
#
#   SCRAPER_SMTP_HOST      e.g. smtp.gmail.com
#   SCRAPER_SMTP_PORT      587 (STARTTLS) or 465 (SSL); defaults to 587
#   SCRAPER_SMTP_USER      the sending account
#   SCRAPER_SMTP_PASSWORD  an app password, not the account password
#
# For Gmail this requires 2FA plus an App Password
# (https://myaccount.google.com/apppasswords) - a normal password will be
# rejected. Without these three variables the run logs what it *would* have
# sent and carries on; a mail problem never fails a scrape.
notifications:
  email:
    enabled: true
    to: duggirala.de@gmail.com
    # from: defaults to SCRAPER_SMTP_USER when unset
    attach_spreadsheet: true

logging:
  file: logs/scraper.log
  level: INFO
